# Run this workflow on pull requests or merge to main/release branches
name: image

on:
  push:
    branches:
      - main
      - "pull-request/[0-9]+"
      - release-*

jobs:
  test-precompiled-native:
    runs-on: linux-amd64-cpu4
    steps:
      - uses: actions/checkout@v7
        name: Check out code
      - name: Test native precompiled helpers
        run: python3 .github/scripts/test-precompiled-native.py

  test-verify-manifest-match:
    runs-on: linux-amd64-cpu4
    steps:
      - uses: actions/checkout@v7
        name: Check out code
      - name: Run verify-manifest-match tests
        run: ./.github/scripts/test-verify-manifest-match.sh

  image:
    runs-on: linux-${{ matrix.arch }}-cpu4
    strategy:
      matrix:
        arch:
          - amd64
          - arm64
        driver: &driver-versions
          - 580.178.04
          - 595.91.07
          - 615.71.09
        dist:
          - ubuntu22.04
          - ubuntu24.04
          - ubuntu26.04
          - rhel8
          - rhel9
          - rhel10
          - rocky8
          - rocky9
          - rocky10
        ispr:
          - ${{ github.event_name == 'pull_request' || startsWith(github.ref_name, 'pull-request/') }}
        exclude:
          - dist: ubuntu26.04
            driver: 580.178.04
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
        name: Check out code
      - name: Calculate build vars
        id: vars
        run: |
          echo "COMMIT_SHORT_SHA=${GITHUB_SHA:0:8}" >> $GITHUB_ENV
          echo "LOWERCASE_REPO_OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | awk '{print tolower($0)}')" >> $GITHUB_ENV
          REPO_FULL_NAME="${{ github.event.pull_request.head.repo.full_name }}"
          echo "${REPO_FULL_NAME}"
          echo "LABEL_IMAGE_SOURCE=https://github.com/${REPO_FULL_NAME}" >> $GITHUB_ENV

          GENERATE_ARTIFACTS="false"
          if [[ "${{ github.actor }}" == "dependabot[bot]" ]]; then
            GENERATE_ARTIFACTS="false"
          elif [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]]; then
            GENERATE_ARTIFACTS="true"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            GENERATE_ARTIFACTS="true"
          fi
          echo "PUSH_ON_BUILD=${GENERATE_ARTIFACTS}" >> $GITHUB_ENV
          echo "BUILD_MULTI_ARCH_IMAGES=true" >> $GITHUB_ENV
          echo "DOCKER_BUILD_PLATFORM_OPTIONS=--platform=linux/${{ matrix.arch }}" >> $GITHUB_ENV

      - name: Set CVE updates
        uses: ./.github/actions/set-cve-updates
        with:
          dist: ${{ matrix.dist }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: /etc/buildkit/buildkitd.toml
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        env:
          IMAGE_NAME: ghcr.io/${LOWERCASE_REPO_OWNER}/driver
          VERSION: ${COMMIT_SHORT_SHA}-${{ matrix.arch }}
        run: |
          DRIVER_VERSIONS=${{ matrix.driver }} make build-${{ matrix.dist }}-${{ matrix.driver }}

  image-manifest:
    if: ${{ !cancelled() && github.actor != 'dependabot[bot]' }}
    needs: image
    runs-on: linux-amd64-cpu4
    strategy:
      matrix:
        driver: *driver-versions
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
        name: Check out code
      - name: Get supported distributions
        id: supported-distributions
        uses: mikefarah/yq@v4.53.6
        env:
          DRIVER: ${{ matrix.driver }}
        with:
          cmd: >-
            yq -r '
              .jobs.image.strategy.matrix as $matrix |
              $matrix.dist |
              map(
                select(
                  . as $dist |
                  (
                    $matrix.exclude |
                    map(select(.driver == strenv(DRIVER) and .dist == $dist)) |
                    length
                  ) == 0
                )
              ) |
              .[]
            ' .github/workflows/image.yaml
      - name: Calculate manifest vars
        run: |
          echo "COMMIT_SHORT_SHA=${GITHUB_SHA:0:8}" >> "$GITHUB_ENV"
          echo "LOWERCASE_REPO_OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | awk '{print tolower($0)}')" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: /etc/buildkit/buildkitd.toml
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-architecture manifest
        env:
          DRIVER: ${{ matrix.driver }}
          SUPPORTED_DISTRIBUTIONS: ${{ steps.supported-distributions.outputs.result }}
        run: |
          set -euo pipefail
          IMAGE_NAME="ghcr.io/${LOWERCASE_REPO_OWNER}/driver"

          if [[ -z "$SUPPORTED_DISTRIBUTIONS" ]]; then
            echo "No supported distributions found for driver $DRIVER" >&2
            exit 1
          fi

          FAILED_MANIFESTS=()
          while IFS= read -r DIST; do
            if ! docker buildx imagetools create \
              --tag "${IMAGE_NAME}:${COMMIT_SHORT_SHA}-${DRIVER}-${DIST}" \
              "${IMAGE_NAME}:${COMMIT_SHORT_SHA}-amd64-${DRIVER}-${DIST}" \
              "${IMAGE_NAME}:${COMMIT_SHORT_SHA}-arm64-${DRIVER}-${DIST}"; then
              FAILED_MANIFESTS+=("${DRIVER}-${DIST}")
            fi
          done <<< "$SUPPORTED_DISTRIBUTIONS"

          if (( ${#FAILED_MANIFESTS[@]} > 0 )); then
            printf 'Failed to create manifest: %s\n' "${FAILED_MANIFESTS[@]}" >&2
            exit 1
          fi

  pre-compiled:
    needs: test-precompiled-native
    runs-on: linux-${{ matrix.arch }}-cpu4
    strategy:
      matrix:
        arch: [amd64, arm64]
        driver:
          - 580
          - 595
        flavor:
          - aws
          - azure
          - azure-fde
          - generic
          - nvidia
          - oracle
        dist:
          - ubuntu22.04
          - ubuntu24.04
          - ubuntu26.04
        lts_kernel:
          - 5.15
          - 6.8
          # Quoted because YAML reads 7.0 as a float, which renders back as "7".
          - "7.0"
        ispr:
          - ${{ github.event_name == 'pull_request' || startsWith(github.ref_name, 'pull-request/') }}
        exclude:
          - arch: arm64
            dist: ubuntu22.04
          - arch: arm64
            flavor: azure-fde
          - ispr: true
            flavor: azure
          - ispr: true
            flavor: aws
          - ispr: true
            flavor: nvidia
          - ispr: true
            flavor: oracle
          - lts_kernel: 5.15
            dist: ubuntu24.04
          - lts_kernel: 5.15
            dist: ubuntu26.04
          - lts_kernel: 6.8
            dist: ubuntu26.04
          - lts_kernel: "7.0"
            dist: ubuntu22.04
          - driver: 580
            dist: ubuntu26.04
          - flavor: azure-fde
            dist: ubuntu22.04
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
        name: Check out code
      - name: Calculate build vars
        id: vars
        run: |
          echo "COMMIT_SHORT_SHA=${GITHUB_SHA:0:8}" >> $GITHUB_ENV
          echo "LOWERCASE_REPO_OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | awk '{print tolower($0)}')" >> $GITHUB_ENV
          REPO_FULL_NAME="${{ github.event.pull_request.head.repo.full_name }}"
          echo "${REPO_FULL_NAME}"
          echo "LABEL_IMAGE_SOURCE=https://github.com/${REPO_FULL_NAME}" >> $GITHUB_ENV

          GENERATE_ARTIFACTS="false"
          if [[ "${{ github.actor }}" == "dependabot[bot]" ]]; then
            GENERATE_ARTIFACTS="false"
          elif [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]]; then
            GENERATE_ARTIFACTS="true"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            GENERATE_ARTIFACTS="true"
          fi
          echo "PUSH_ON_BUILD=${GENERATE_ARTIFACTS}" >> $GITHUB_ENV
          echo "BUILD_MULTI_ARCH_IMAGES=true" >> $GITHUB_ENV
          echo "DOCKER_BUILD_PLATFORM_OPTIONS=--platform=linux/${{ matrix.arch }}" >> $GITHUB_ENV

      - name: Set CVE updates
        uses: ./.github/actions/set-cve-updates
        with:
          dist: ${{ matrix.dist }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: /etc/buildkit/buildkitd.toml
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build base image and get kernel version
        env:
          IMAGE_NAME: ghcr.io/${{ env.LOWERCASE_REPO_OWNER }}/driver
          BASE_VERSION: ${{ env.COMMIT_SHORT_SHA }}
          DIST: ${{ matrix.dist }}
          ARCH: ${{ matrix.arch }}
          DRIVER_BRANCH: ${{ matrix.driver }}
          KERNEL_FLAVOR: ${{ matrix.flavor }}
          LTS_KERNEL: ${{ matrix.lts_kernel }}
        run: bash .github/scripts/build-precompiled-base.sh
      - name: Build image
        env:
          IMAGE_NAME: ghcr.io/${{ env.LOWERCASE_REPO_OWNER }}/driver
          VERSION: ${{ env.COMMIT_SHORT_SHA }}-${{ matrix.arch }}
          PRECOMPILED: "true"
          DIST: signed_${{ matrix.dist }}
        run: |
          source kernel_version.txt
          make DRIVER_VERSIONS="$DRIVER_VERSIONS" DRIVER_BRANCH=${{ matrix.driver }} \
            KERNEL_FLAVOR=${{ matrix.flavor }} KERNEL_VERSION="$KERNEL_VERSION" \
            DOCKER_BUILD_PLATFORM_OPTIONS="--platform=linux/${{ matrix.arch }}" \
            build-${DIST}-${DRIVER_VERSION}
      - name: Save native kernel metadata
        if: env.PUSH_ON_BUILD == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: precompiled-metadata-${{ matrix.driver }}-${{ matrix.lts_kernel }}-${{ matrix.flavor }}-${{ matrix.dist }}-${{ matrix.arch }}
          path: kernel_version.txt
          retention-days: 1

  precompiled-manifest:
    needs: pre-compiled
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: linux-amd64-cpu4
    steps:
      - name: Download native kernel metadata
        uses: actions/download-artifact@v8
        with:
          pattern: precompiled-metadata-*
          path: metadata
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: /etc/buildkit/buildkitd.toml
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble kernel tags from native images
        run: |
          set -euo pipefail
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/driver"
          COMMIT_SHORT_SHA=${GITHUB_SHA:0:8}
          declare -A sources=()
          for metadata in metadata/*/kernel_version.txt; do
            name=${metadata#metadata/precompiled-metadata-}
            name=${name%/kernel_version.txt}
            arch=${name##*-}
            name=${name%-*}
            dist=${name##*-}
            driver=${name%%-*}
            source "$metadata"
            : "${KERNEL_VERSION:?Native kernel metadata is missing}"
            tag="${driver}-${KERNEL_VERSION}-${dist}"
            sources[$tag]+=" ${IMAGE_NAME}:${COMMIT_SHORT_SHA}-${arch}-${tag}"
          done
          for tag in "${!sources[@]}"; do
            read -r -a images <<< "${sources[$tag]}"
            docker buildx imagetools create --tag "${IMAGE_NAME}:${COMMIT_SHORT_SHA}-${tag}" "${images[@]}"
          done
